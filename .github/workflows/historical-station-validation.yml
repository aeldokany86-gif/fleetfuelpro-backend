name: Historical Station Operations validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/station-historical-missing-operations]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
