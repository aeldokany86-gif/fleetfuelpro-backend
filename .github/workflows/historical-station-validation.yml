name: Historical Station Operations validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/station-historical-missing-operations]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand operations-historical-station
      # Existing unrelated Nest boilerplate suites have missing mock providers;
      # they are reported separately and do not gate this feature's tests.
      - name: Existing full suite (diagnostic only)
        run: npm test -- --runInBand
        continue-on-error: true
