# fly.toml app configuration file generated for fleetfuelpro-backend on 2026-07-30T22:54:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fleetfuelpro-backend'
primary_region = 'nrt'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'
  seed_command = 'node seed.js'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
